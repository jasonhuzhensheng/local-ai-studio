<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>账号 · macbook pro工作室</title><link rel="stylesheet" href="/account.css"><script src="/account.js" defer></script><link rel="stylesheet" href="/i18n.css"><script src="/i18n.js" defer></script><link rel="stylesheet" href="/studio-theme.css"><script src="/studio-shell.js" defer></script></head><body class="brick-studio studio-account"><main>
<header><small>macbook pro工作室</small><h1 id="title">账号</h1><nav><a href="/edit">图片生成</a><a href="/chat">文字对话</a><a href="/video">视频生成</a></nav></header>
<p id="notice" role="status" aria-live="polite">正在读取账号状态…</p>
<section id="login-section" hidden><form id="login-form"><label>用户名<input name="username" required pattern="[A-Za-z0-9_-]{3,32}" maxlength="32" autocomplete="username" autocapitalize="none" spellcheck="false"></label><label>密码<input name="password" type="password" required maxlength="128" autocomplete="current-password"></label><button class="primary" type="submit" id="login-submit">登录</button></form><p id="setup-note" hidden>首次创建只能在运行服务的 Mac 上，通过 127.0.0.1 地址进行。密码至少12个字符。</p></section>
<section id="account-section" hidden><h2 id="identity"></h2><p>图片、视频及服务端任务为共享工作室数据，已登录账号可共同查看和操作。</p><button id="logout">退出登录</button><h2>修改我的密码</h2><form id="password-form"><label>当前密码<input type="password" name="oldPassword" autocomplete="current-password" required maxlength="128"></label><label>新密码<input type="password" name="password" autocomplete="new-password" required minlength="12" maxlength="128"></label><button type="submit">修改密码并退出所有设备</button></form></section>
<section id="admin-section" hidden><h2>新增账号</h2><form id="create-form"><label>用户名<input name="username" required pattern="[A-Za-z0-9_-]{3,32}" maxlength="32" autocomplete="off" autocapitalize="none"></label><label>初始密码<input name="password" type="password" required minlength="12" maxlength="128" autocomplete="new-password"></label><label>角色<select name="role"><option value="user">普通用户</option><option value="admin">管理员</option></select></label><button type="submit">创建账号</button></form><h2>账号管理</h2><div id="users"></div></section>
<dialog id="reset-dialog"><form id="reset-form"><h2 id="reset-title">重置密码</h2><input name="id" type="hidden"><label>新密码<input name="password" type="password" required minlength="12" maxlength="128" autocomplete="new-password"></label><p>重置后，该账号的所有登录会话将失效。</p><button type="submit">确认重置</button><button type="button" id="reset-cancel">取消</button></form></dialog>
</main></body></html>
