  <style>
    :root{font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#202b25;background:#f5f6f3}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;flex-direction:column}
    header{height:64px;background:#fff;border-bottom:1px solid #e0e5df;padding:0 max(20px,calc((100vw - 1080px)/2));display:flex;align-items:center;justify-content:space-between;gap:16px}header strong{font-size:16px}a,button{color:#275c43}header a{font-size:14px}header .entry-nav{display:flex;gap:4px;padding:4px;border:1px solid #dce3da;background:#fff;border-radius:12px}header .entry-link{color:#42564b;text-decoration:none;font-size:13px;padding:8px 12px;border-radius:8px;white-space:nowrap}header .entry-link:hover{background:#eff3ec}header .entry-link.active{background:#275c43;color:#fff}
    main{width:min(1080px,100%);margin:0 auto;flex:1;display:flex;flex-direction:column;padding:24px 20px 16px}.intro{margin:0 auto 18px;text-align:center;color:#596a60}.intro h1{font-size:24px;color:#24382d;margin:0 0 8px}.intro p{font-size:14px;line-height:1.6;margin:0}.layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:18px;align-items:start;flex:1}.history-panel{background:#fff;border:1px solid #e0e5df;border-radius:14px;padding:14px;position:sticky;top:12px}.history-heading{font-size:14px;font-weight:700;margin:0 0 10px}.queue-state{font-size:12px;line-height:1.5;color:#526459;background:#f2f5f0;border-radius:9px;padding:9px 10px;margin-bottom:10px}.history-list{display:flex;flex-direction:column;gap:6px;max-height:55vh;overflow:auto}.history-item{display:flex;flex-direction:column;align-items:flex-start;gap:4px;width:100%;text-align:left;padding:9px 10px;border:1px solid transparent;border-radius:9px;background:transparent}.history-item:hover{background:#f5f7f4}.history-item.selected{background:#edf3eb;border-color:#dce7dc}.history-item:disabled{cursor:default}.history-title{font-size:13px;line-height:1.4;color:#26392e;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}.history-state{font-size:11px;color:#6e7c72}.history-state.running{color:#956319}.history-state.failed{color:#a53737}.history-empty{font-size:12px;color:#7b887f;margin:8px 2px}.storage-note{font-size:11px;color:#8a7661;margin:8px 0 0}.workspace{min-width:0;display:flex;flex-direction:column}.messages{display:flex;flex-direction:column;gap:18px;padding:12px 0 28px;min-height:250px}.message{display:flex;gap:12px;align-items:flex-start}.message.user{flex-direction:row-reverse}.avatar{width:30px;height:30px;flex:none;border-radius:50%;display:grid;place-items:center;background:#e3ebe3;color:#275c43;font-size:12px;font-weight:700}.user .avatar{background:#dce8f5;color:#325c83}.bubble{max-width:min(740px,calc(100% - 48px));padding:13px 16px;border-radius:14px;background:#fff;border:1px solid #e4e8e2;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.65}.user .bubble{background:#eaf1e9;border-color:#eaf1e9}.reply-wrap{display:flex;flex-direction:column;align-items:flex-start;gap:6px;max-width:calc(100% - 42px)}.reply-wrap .bubble{max-width:100%}.reply-actions{display:flex;gap:8px}.delete-reply{font-size:12px;padding:5px 9px;color:#a53737}.delete-reply:disabled{opacity:.45;cursor:default}.copy-reply{font-size:12px;padding:5px 9px;color:#526459}.copy-reply:disabled{opacity:.45;cursor:default}.bubble.pending:after{content:"▋";animation:blink 1s steps(2,start) infinite}@keyframes blink{to{visibility:hidden}}
    .composer{position:sticky;bottom:0;padding:12px 0 4px;background:#f5f6f3}.composer-box{border:1px solid #cfd8ce;border-radius:16px;background:#fff;padding:10px;box-shadow:0 4px 20px #24382d0b}.composer textarea{border:0;outline:0;resize:vertical;min-height:56px;max-height:200px;width:100%;font:inherit;line-height:1.5;padding:8px;color:inherit}.controls{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:4px 2px 0}.hint,.status{font-size:12px;color:#6a786f}.options{display:flex;align-items:center;gap:8px;min-width:0}.options label{font-size:12px;color:#6a786f;white-space:nowrap}.options select{font:inherit;font-size:12px;color:#34483b;border:1px solid #d2dbd1;background:#fff;border-radius:8px;padding:7px 8px;max-width:180px}.buttons{display:flex;gap:8px}button{font:inherit;cursor:pointer;border:1px solid #d2dbd1;background:white;border-radius:9px;padding:8px 12px}button:hover{background:#f0f4ef}button[hidden]{display:none}.send{background:#275c43;color:#fff;border:0}.send:hover{background:#204d38}.send:disabled,.stop:disabled{opacity:.5;cursor:wait}.stop{color:#a53737;border-color:#e6caca}.stop:hover{background:#fff2f2}.error{color:#a53737}.stopped{color:#68776d}.empty{font-size:14px;color:#68776d;text-align:center;padding:12px}.foot{font-size:11px;color:#869188;text-align:center;padding:8px 0}
    @media(max-width:720px){header{height:auto;min-height:64px;flex-wrap:wrap;padding:10px 16px}header strong{font-size:14px}main{padding:18px 12px 10px}.layout{grid-template-columns:1fr;gap:12px}.history-panel{position:static;padding:11px}.history-list{max-height:190px}.messages{min-height:160px}.controls{align-items:flex-start;flex-wrap:wrap}.options{flex-wrap:wrap}.options select{max-width:150px}.bubble{padding:11px 13px}}
  </style>
<script src="/auth-guard.js"></script><link rel="stylesheet" href="/i18n.css"><script src="/i18n.js" defer></script><link rel="stylesheet" href="/studio-theme.css"><script src="/studio-shell.js" defer></script></head>
<body class="brick-studio studio-chat">
  <header><strong>macbook pro工作室</strong><nav class="entry-nav" aria-label="本地工具入口"><a class="entry-link" href="/edit">图片生成</a><a class="entry-link active" aria-current="page" href="/chat">文字对话</a><a class="entry-link" href="/video">视频生成</a><a class="entry-link" href="/account">账号 / 退出</a></nav></header>
  <main>
    <div class="intro"><h1>有什么想聊的？</h1><p>由 LM Studio 在本机运行。对话直接发送到本机模型，不经过云端服务。</p></div>
    <div class="layout">
      <aside class="history-panel" aria-label="对话历史和队列"><h2 class="history-heading">对话历史</h2><div id="queue-state" class="queue-state" role="status">当前无生成任务 · 等待 0 项</div><div id="history-list" class="history-list"></div><p id="storage-note" class="storage-note"></p></aside>
      <div class="workspace">
        <section id="messages" class="messages" aria-live="polite"><div class="empty">输入问题开始对话</div></section>
        <form id="form" class="composer"><div class="composer-box"><textarea id="input" maxlength="6000" placeholder="输入消息…（回车发送）" aria-label="消息内容" required></textarea><div class="controls"><div class="options"><span id="status" class="status">本机模型 · 上下文约3.2万词元</span><label for="thinking-mode">回答方式</label><select id="thinking-mode"><option value="off" selected>直接回答</option><option value="on">深入分析</option></select><label for="response-mode">回答长度</label><select id="response-mode" aria-label="回答长度" title="较短回答能更快结束；长任务可切换详细"><option value="fast">快速 · 最多约1千词元</option><option value="standard">标准 · 最多约4千词元</option><option value="detailed" selected>详细 · 最多约8千词元</option><option value="maximum">极限 · 使用剩余上下文</option></select></div><div class="buttons"><button id="clear" type="button">新对话</button><button id="stop" class="stop" type="button" hidden>停止生成</button><button id="send" class="send" type="submit">发送</button></div></div></div><div class="foot">历史只保存在此浏览器；生成请求逐个处理，不会自动排队；刷新页面后可继续查看后台任务（服务重启会中止）。回答长度包含分析与正文。极限档在当前32K上下文内扣除输入与历史后分配输出空间；词元不等于中文字数，也不保证每次写满。</div></form>
      </div>
    </div>
  </main>
  <script type="module" src="/chat.js?v=20260930-mobile1"></script>
</body>
</html>
